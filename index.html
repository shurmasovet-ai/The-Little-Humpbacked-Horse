<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конёк-Горбунок: Механика Авось</title>
    <style>
        body {
            background-color: #12121a; color: #f0e6d2; font-family: 'Segoe UI', Tahoma, sans-serif;
            text-align: center; margin: 0; padding: 20px; user-select: none;
        }
        #story-panel {
            background: #2a1a1a; border: 2px solid #ff4500; padding: 15px; border-radius: 10px;
            margin-bottom: 20px; font-style: italic; color: #ffd700; font-size: 18px;
        }
        .resources {
            display: flex; justify-content: center; gap: 40px; font-size: 24px; font-weight: bold; margin-bottom: 30px;
        }
        .res-item span { color: #ff8c00; }
        
        #click-area {
            background: radial-gradient(circle, #ff8c00, #8b0000); width: 220px; height: 220px;
            border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; cursor: pointer; box-shadow: 0 0 40px #ff4500;
            transition: transform 0.05s; border: 4px solid #ffd700; position: relative;
        }
        #click-area:active { transform: scale(0.92); }
        
        .shop { display: flex; justify-content: center; gap: 15px; margin-top: 30px; flex-wrap: wrap; }
        .card {
            background: #222; border: 2px solid #555; border-radius: 10px; padding: 15px; width: 220px;
            transition: border-color 0.2s;
        }
        .card:hover { border-color: #ffd700; }
        .btn {
            background: #ff4500; color: white; border: none; padding: 10px 15px; margin-top: 10px;
            border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%;
        }
        .btn:disabled { background: #333; color: #666; cursor: not-allowed; }
        .btn-merge { background: #800080; } /* Пурпурная кнопка для магии */
        
        .floating-text {
            position: absolute; color: #ffd700; font-size: 24px; font-weight: bold;
            pointer-events: none; animation: floatUp 1s ease-out forwards;
        }
        .floating-feather { color: #ff00ff; }
        @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-60px); opacity: 0; } }
    </style>
</head>
<body>

    <div id="story-panel">📜 Указ Царя: Собери 50 пшеницы, чтобы выманить волшебную Кобылицу!</div>

    <div class="resources">
        <div class="res-item">🌾 Пшеница: <span id="wheat">0</span> <br><small style="font-size: 14px" id="stats">В сек: 0 | За клик: 1</small></div>
        <div class="res-item">🪶 Перья: <span id="feathers">0</span></div>
    </div>

    <div id="click-area" onclick="clickAction(event)">РУБИТЬ<br>ПШЕНИЦУ</div>

    <div class="shop">
        <div class="card">
            <h3>💪 Сила Ивана</h3>
            <p>Усиливает клик (+1)</p>
            <button class="btn" id="buy-ivan" onclick="buyIvan()">Цена: <span id="ivan-cost">20</span> 🌾</button>
        </div>
        <div class="card">
            <h3>🐎 Конёк-Горбунок</h3>
            <p>Авто-сбор (+2/сек)</p>
            <button class="btn" id="buy-konok" onclick="buyKonok()">Цена: <span id="konok-cost">50</span> 🌾</button>
        </div>
        <div class="card">
            <h3>✨ Слияние (Merge)</h3>
            <p>Соедини 5 перьев в Огненный Хвост (Доход x2)</p>
            <button class="btn btn-merge" id="buy-merge" onclick="mergeFeathers()">Слить перья!</button>
        </div>
    </div>

    <script>
        // Игровые данные
        let data = { wheat: 0, feathers: 0, clickPower: 1, autoPower: 0, multiplier: 1, storyStage: 0 };
        let costs = { ivan: 20, konok: 50 };

        const ui = {
            wheat: document.getElementById('wheat'), feathers: document.getElementById('feathers'),
            stats: document.getElementById('stats'), story: document.getElementById('story-panel'),
            ivanBtn: document.getElementById('buy-ivan'), konokBtn: document.getElementById('buy-konok'),
            mergeBtn: document.getElementById('buy-merge')
        };

        function clickAction(e) {
            let amount = data.clickPower * data.multiplier;
            data.wheat += amount;
            createFloater(e, `+${amount}🌾`);
            
            // Механика дропа перьев (10% шанс)
            if (Math.random() < 0.10) {
                data.feathers++;
                createFloater(e, `+1 🪶`, true);
            }
            checkStory(); updateUI();
        }

        function buyIvan() {
            if (data.wheat >= costs.ivan) {
                data.wheat -= costs.ivan; data.clickPower += 1;
                costs.ivan = Math.floor(costs.ivan * 1.5); updateUI();
            }
        }

        function buyKonok() {
            if (data.wheat >= costs.konok) {
                data.wheat -= costs.konok; data.autoPower += 2;
                costs.konok = Math.floor(costs.konok * 1.5); updateUI();
            }
        }

        function mergeFeathers() {
            if (data.feathers >= 5) {
                data.feathers -= 5;
                data.multiplier *= 2; // Умножаем весь доход на 2
                ui.story.innerHTML = "🔥 ВАУ! Ты создал Огненный Хвост! Весь доход удвоен!";
                ui.story.style.color = "#ff4500";
                updateUI();
            }
        }

        setInterval(() => {
            if (data.autoPower > 0) {
                data.wheat += (data.autoPower * data.multiplier);
                checkStory(); updateUI();
            }
        }, 1000);

        function checkStory() {
            if (data.wheat >= 50 && data.storyStage === 0) {
                ui.story.innerHTML = "🐎 Кобылица поймана! Теперь она дает перья. Копи на Конька!";
                data.storyStage = 1;
            } else if (data.autoPower > 0 && data.storyStage === 1) {
                ui.story.innerHTML = "👑 Царь в гневе! Соедини 5 перьев, чтобы удивить его.";
                data.storyStage = 2;
            }
        }

        function updateUI() {
            ui.wheat.innerText = data.wheat; ui.feathers.innerText = data.feathers;
            ui.stats.innerText = `В сек: ${data.autoPower * data.multiplier} | За клик: ${data.clickPower * data.multiplier}`;
            
            document.getElementById('ivan-cost').innerText = costs.ivan;
            document.getElementById('konok-cost').innerText = costs.konok;
            
            ui.ivanBtn.disabled = data.wheat < costs.ivan;
            ui.konokBtn.disabled = data.wheat < costs.konok;
            ui.mergeBtn.disabled = data.feathers < 5;
        }

        function createFloater(e, text, isFeather = false) {
            const area = document.getElementById('click-area');
            const rect = area.getBoundingClientRect();
            const floater = document.createElement('div');
            floater.className = 'floating-text' + (isFeather ? ' floating-feather' : '');
            floater.innerText = text;
            floater.style.left = (e.clientX - rect.left + (Math.random() * 40 - 20)) + 'px';
            floater.style.top = (e.clientY - rect.top) + 'px';
            area.appendChild(floater);
            setTimeout(() => floater.remove(), 1000);
        }

        updateUI();
    </script>
</body>
</html>

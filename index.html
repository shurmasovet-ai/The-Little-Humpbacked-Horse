<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конёк-Горбунок: Эволюция Царства</title>
    <style>
        body {
            background-color: #1a1a24;
            color: #f0e6d2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        h1 {
            color: #ffd700;
            text-shadow: 0 0 10px #ff8c00;
        }
        #resource-display {
            font-size: 28px;
            margin: 20px 0;
            font-weight: bold;
        }
        /* Главная кнопка-кликер */
        #click-area {
            background: radial-gradient(circle, #ff8c00, #8b0000);
            width: 200px;
            height: 200px;
            border-radius: 50%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 30px #ff4500;
            transition: transform 0.05s, box-shadow 0.1s;
            position: relative;
            border: 4px solid #ffd700;
        }
        #click-area:active {
            transform: scale(0.95);
            box-shadow: 0 0 10px #ff4500;
        }
        /* Магазин улучшений */
        .shop {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .upgrade-btn {
            background: #2a2a35;
            border: 2px solid #ffd700;
            color: #fff;
            padding: 15px 25px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .upgrade-btn:hover {
            background: #3a3a45;
        }
        .upgrade-btn:disabled {
            background: #1a1a20;
            border-color: #555;
            color: #777;
            cursor: not-allowed;
        }
        /* Анимация всплывающих цифр */
        .floating-text {
            position: absolute;
            color: #ffd700;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 0 5px #000;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>Конёк-Горбунок: Путь Царя</h1>
    
    <div id="resource-display">
        Пшеница: <span id="wheat-count">0</span> 🌾<br>
        <span style="font-size: 16px; color: #aaa;">Добыча в сек: <span id="auto-count">0</span></span>
    </div>

    <div id="click-area" onclick="clickAction(event)">
        СОБРАТЬ<br>ПШЕНИЦУ!
    </div>

    <div class="shop">
        <button id="buy-konok-btn" class="upgrade-btn" onclick="buyKonok()">
            🐎 Нанять Конька-Горбунка <br>
            Цена: <span id="konok-cost">10</span> 🌾 <br>
            (+1 🌾/сек)
        </button>
    </div>

    <script>
        // Игровые переменные
        let wheat = 0;
        let clickPower = 1;
        let autoWheat = 0;
        let konokCost = 10;
        let konokCount = 0;

        // Элементы интерфейса
        const wheatEl = document.getElementById('wheat-count');
        const autoEl = document.getElementById('auto-count');
        const konokBtn = document.getElementById('buy-konok-btn');
        const konokCostEl = document.getElementById('konok-cost');

        // Функция клика игроком
        function clickAction(event) {
            wheat += clickPower;
            updateUI();
            createFloatingText(event, `+${clickPower}`);
        }

        // Покупка авто-помощника (Конька)
        function buyKonok() {
            if (wheat >= konokCost) {
                wheat -= konokCost;
                autoWheat += 1;
                konokCount += 1;
                // Увеличиваем цену следующего Конька на 15%
                konokCost = Math.floor(konokCost * 1.15); 
                updateUI();
            }
        }

        // Автоматический сбор (Игровой цикл)
        setInterval(() => {
            if (autoWheat > 0) {
                wheat += autoWheat;
                updateUI();
            }
        }, 1000); // Срабатывает каждую секунду

        // Обновление цифр на экране
        function updateUI() {
            wheatEl.innerText = wheat;
            autoEl.innerText = autoWheat;
            konokCostEl.innerText = konokCost;
            
            // Проверка, хватает ли денег на кнопку
            if (wheat >= konokCost) {
                konokBtn.disabled = false;
            } else {
                konokBtn.disabled = true;
            }
        }

        // Создание всплывающих цифр для "дофаминового" эффекта
        function createFloatingText(e, text) {
            const clickArea = document.getElementById('click-area');
            const rect = clickArea.getBoundingClientRect();
            
            const floater = document.createElement('div');
            floater.className = 'floating-text';
            floater.innerText = text;
            
            // Позиционируем там, где был клик мышкой
            floater.style.left = (e.clientX - rect.left) + 'px';
            floater.style.top = (e.clientY - rect.top) + 'px';
            
            clickArea.appendChild(floater);
            
            // Удаляем элемент после завершения анимации
            setTimeout(() => {
                floater.remove();
            }, 1000);
        }

        // Инициализация
        updateUI();
    </script>

</body>
</html>

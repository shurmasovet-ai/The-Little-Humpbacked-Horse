<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Конёк-Горбунок 3D: Начало</title>
    <style>
        /* Убираем отступы, чтобы игра была на весь экран */
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        /* Игровой интерфейс поверх 3D */
        #ui { 
            position: absolute; top: 10px; left: 10px; color: white; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8); pointer-events: none;
        }
        h1 { margin: 0; font-size: 24px; color: #FFD700; }
        p { margin: 5px 0 0 0; font-size: 16px; }
        
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.5); font-size: 24px; pointer-events: none;
        }
    </style>
    <!-- Подключаем движок Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        <h1>Славянское 3D-Выживание</h1>
        <p>Управление: <b>W</b> - Вперед, <b>S</b> - Назад, <b>A / D</b> - Повороты влево/вправо</p>
    </div>
    <div id="crosshair">+</div>

    <script>
        // 1. НАСТРОЙКА СЦЕНЫ И КАМЕРЫ
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Голубое небо
        scene.fog = new THREE.Fog(0x87CEEB, 10, 100); // Легкий туман вдалеке

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Включаем тени
        document.body.appendChild(renderer.domElement);

        // 2. ОСВЕЩЕНИЕ (Солнце)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4); // Базовый свет
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(50, 100, 50);
        sunLight.castShadow = true; // Солнце отбрасывает тени
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 200;
        sunLight.shadow.camera.left = -50;
        sunLight.shadow.camera.right = 50;
        sunLight.shadow.camera.top = 50;
        sunLight.shadow.camera.bottom = -50;
        scene.add(sunLight);

        // 3. ЗЕМЛЯ (Поляна)
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x558B2F }); // Зеленая трава
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2; // Кладем плоскость горизонтально
        ground.receiveShadow = true;
        scene.add(ground);

        // 4. СОЗДАНИЕ ГЛАВНОГО ГЕРОЯ (ИВАН)
        const player = new THREE.Group(); // Группа, чтобы объединить модель и камеру
        scene.add(player);
        player.position.y = 1;

        // "Моделька" Ивана (пока синий куб)
        const bodyGeo = new THREE.BoxGeometry(2, 2, 2);
        const bodyMat = new THREE.MeshLambertMaterial({ color: 0x1E88E5 });
        const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
        bodyMesh.castShadow = true;
        player.add(bodyMesh);

        // Настраиваем камеру (Вид от 3-го лица)
        // Камера висит сзади (-Z) и чуть сверху (+Y)
        camera.position.set(0, 4, 8); 
        camera.lookAt(player.position);
        player.add(camera); // Прикрепляем камеру к Ивану!

        // 5. ГЕНЕРАЦИЯ ЛЕСА (Препятствия)
        const treeMat = new THREE.MeshLambertMaterial({ color: 0x2E7D32 }); // Листва
        const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5D4037 }); // Ствол

        for (let i = 0; i < 40; i++) {
            // Случайные координаты
            const x = (Math.random() - 0.5) * 150;
            const z = (Math.random() - 0.5) * 150;

            // Ствол
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 3), trunkMat);
            trunk.position.set(x, 1.5, z);
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            scene.add(trunk);

            // Крона (Конус)
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(2.5, 5), treeMat);
            leaves.position.set(x, 4.5, z);
            leaves.castShadow = true;
            scene.add(leaves);
        }

        // 6. УПРАВЛЕНИЕ ИВАНОМ
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        // Адаптация экрана при изменении размера окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 7. ИГРОВОЙ ЦИКЛ (Анимация и Физика)
        const moveSpeed = 0.15;
        const rotateSpeed = 0.04;

        function animate() {
            requestAnimationFrame(animate);

            // Логика перемещения (Танковое управление)
            // W / S - Движение вперед и назад по направлению взгляда
            if (keys['KeyW']) { player.translateZ(-moveSpeed); }
            if (keys['KeyS']) { player.translateZ(moveSpeed); }
            
            // A / D - Вращение игрока вокруг своей оси (камера крутится вместе с ним)
            if (keys['KeyA']) { player.rotation.y += rotateSpeed; }
            if (keys['KeyD']) { player.rotation.y -= rotateSpeed; }

            // Отрисовка кадра
            renderer.render(scene, camera);
        }

        // Запуск
        animate();
    </script>
</body>
</html>
